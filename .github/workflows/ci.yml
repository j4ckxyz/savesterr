name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Newest and oldest GitHub-hosted image of each OS (+ Intel macOS).
        os: [ubuntu-24.04, ubuntu-22.04, macos-26, macos-14, macos-15-intel, windows-2025, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/build.ts --current
      - name: Smoke test the compiled binary
        shell: bash
        run: |
          ./dist/songsterr-pdf --version
          ./dist/songsterr-pdf --help | head -3
          ./dist/songsterr-pdf 444 --list | head -3
          ./dist/songsterr-pdf "paranoid black sabbath" -y --no-open -o smoke
          ./dist/songsterr-pdf 444 -t 5,6 --combine --paper letter -y --no-open -o smoke
          ls -la smoke
          test "$(ls smoke/*.pdf | wc -l)" -ge 4

  linux-distros:
    name: Linux distros (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts linux-${{ matrix.arch }} linux-${{ matrix.arch }}-musl
      - if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
      - name: Run in each distro
        shell: bash # -o pipefail, so a failure isn't hidden by tee
        run: |
          ARCH=${{ matrix.arch }} scripts/test-distros.sh | tee -a "$GITHUB_STEP_SUMMARY"
